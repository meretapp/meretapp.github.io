<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Meret">
  <!--
    The Meret app mark: the white lowercase m from Duma Bold on the coral tile.
    Same glyph and gradient as the Android launcher and the record button, so the
    web mark and the app mark read as one designed thing.
    The m path is the exact Duma Bold outline (76.1 by 59.1 glyph box) with a 3 unit
    stroke for optical weight at icon size, matching app/src/main/res/drawable/ic_brand_m.xml.
  -->
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A63"/>
      <stop offset="1" stop-color="#C33A18"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="33.3" fill="url(#coral)"/>
  <g transform="translate(25.6,33.55) scale(0.9355)">
    <g transform="translate(3,3)">
