<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Source for the social share image. Rendered at exactly 1200x630 and captured to
    assets/og-image.png. It reuses the site's real .wordmark and .dot component so the
    coral tone dot sits exactly where it does everywhere else. Not linked from the site.
  -->
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    html, body { margin: 0; padding: 0; background: #08070B; }
    .og {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background: #08070B; color: var(--text); font-family: var(--sans);
      padding: 92px 96px; box-sizing: border-box;
      display: flex; flex-direction: column; justify-content: center;
    }
    /* The larger, upper-right coral glow from the original share card: a big soft ellipse
       centered near (880,150) fading to nothing at its edge. */
    .og::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 520px 360px at 880px 150px, rgba(255,106,61,0.22), rgba(255,106,61,0) 100%);
    }
    .og::after {
      content: ""; position: absolute; bottom: -200px; left: -150px; width: 640px; height: 560px;
      background: radial-gradient(closest-side, rgba(142,123,255,0.15), rgba(142,123,255,0) 70%);
    }
    .og > * { position: relative; z-index: 1; }

    .brand { display: inline-flex; align-items: center; gap: 20px; margin-bottom: 40px; }
    .brand img { width: 76px; height: 76px; border-radius: 19px; display: block; }
    .brand .wordmark { font-size: 62px; }

    .tagline {
      font-weight: 800; letter-spacing: -0.02em;
      font-size: 60px; line-height: 1.04; margin: 0 0 20px; color: var(--text); max-width: 16ch;
    }
    .tagline .em { color: var(--accent); }
    .sub { font-size: 27px; color: var(--muted); margin: 0 0 48px; line-height: 1.5; }

    /* Full-width waveform: one continuous audio track running the width of the card,
       ends softly faded so it reads as a track rather than a boxed chart. */
    .ogwave {
      display: flex; align-items: center; justify-content: space-between;
      height: 104px; margin: 0 -96px; padding: 0 40px;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
              mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%);
    }
    .ogwave span { width: 5px; border-radius: 3px; background: linear-gradient(var(--accent-2), var(--accent)); }
    .ogwave span.v { background: linear-gradient(var(--violet), #6f5cf0); }
  </style>
</head>
