<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Meret. A second brain for musical creativity.">
  <!-- Social share card. Dark canvas, coral mark and wordmark, one waveform line for rhythm.
       If a platform refuses SVG previews, rasterise this to og-image.png at 1200x630. -->
  <defs>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A63"/>
      <stop offset="1" stop-color="#C33A18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6A3D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF6A3D" stop-opacity="0"/>
    </radialGradient>
    <style>
      @font-face { font-family:"Duma"; font-weight:700; src:url("duma-bold.ttf") format("truetype"); }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#08070B"/>
  <ellipse cx="880" cy="150" rx="520" ry="360" fill="url(#glow)"/>
  <g transform="translate(96,150)">
