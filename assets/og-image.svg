  <text x="96" y="360" font-family="Duma, sans-serif" font-weight="700" font-size="112" letter-spacing="4" fill="#F3F0F8">meret<tspan dx="6" baseline-shift="8" font-size="26" fill="#FF6A3D">&#9679;</tspan></text>
  <text x="98" y="430" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="40" fill="#C9C4D6" font-weight="600">A second brain for musical creativity.</text>
  <text x="98" y="486" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="26" fill="#9E99AC">Capture the idea the moment it strikes. Find it again months later.</text>
